<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile - Employee Management System</title>
</head>
<body>

<div class="max-w-6xl mx-auto p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-3xl font-bold">Employee Profile</h1>
      <p class="text-sm text-gray-600">Personal details and information</p>
    </div>

    <a href="/profiles" data-link
      class="inline-flex items-center gap-2 px-4 py-2 rounded bg-blue-600 text-white text-sm hover:bg-blue-700">
      ← Back to Directory
    </a>
    
  </div>

  <!-- MAIN GRID -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- LEFT: Basic Details -->
    <div class="lg:col-span-1 bg-white rounded shadow border overflow-hidden">
      <div class="p-4 border-b">
        <h2 class="font-semibold text-lg">Basic Details</h2>
        <p class="text-sm text-gray-600">Employee information</p>
      </div>

      <div class="p-4">
        <div id="basicLoading" class="text-center py-6">
          <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-500 mx-auto"></div>
          <p class="text-sm text-gray-500 mt-2">Loading...</p>
        </div>

        <div id="basicDetails" class="hidden space-y-4">
          <div class="border rounded p-3 bg-gray-50">
            <div class="text-xs text-gray-500">Employee ID</div>
            <div class="font-semibold text-gray-900" id="employeeId">—</div>
          </div>

          <div class="border rounded p-3 bg-gray-50">
            <div class="text-xs text-gray-500">Name</div>
            <div class="font-semibold text-gray-900" id="employeeName">—</div>
          </div>

          <div class="border rounded p-3 bg-gray-50">
            <div class="text-xs text-gray-500">Email</div>
            <div class="font-semibold text-gray-900" id="employeeEmail">—</div>
          </div>

          <div class="border rounded p-3 bg-gray-50">
            <div class="text-xs text-gray-500">Department</div>
            <div class="font-semibold text-gray-900" id="employeeDepartment">—</div>
          </div>

          <div class="border rounded p-3 bg-gray-50">
            <div class="text-xs text-gray-500">Position</div>
            <div class="font-semibold text-gray-900" id="employeePosition">—</div>
          </div>

          <div class="border rounded p-3 bg-gray-50">
            <div class="text-xs text-gray-500">Salary</div>
            <div class="font-semibold text-green-600" id="employeeSalary">—</div>
          </div>

          <div class="border rounded p-3 bg-gray-50">
            <div class="text-xs text-gray-500">Join Date</div>
            <div class="font-semibold text-gray-900" id="employeeJoinDate">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Export Options -->
    <div class="lg:col-span-2 bg-white rounded shadow border overflow-hidden">
      <div class="p-4 border-b">
        <h2 class="font-semibold text-lg">Actions</h2>
        <p class="text-sm text-gray-600">Export profile data</p>
      </div>

      <div class="p-6 space-y-4">
        <div class="p-4 bg-blue-50 border border-blue-200 rounded">
          <h3 class="font-semibold text-blue-900 mb-2">Export Options</h3>
          <p class="text-sm text-blue-800 mb-4">Download employee information in your preferred format</p>
          
          <div class="flex gap-2">
            <button id="exportCsvBtn"
              class="px-4 py-2 text-sm border rounded bg-white hover:bg-gray-50 inline-flex items-center gap-2">
              <i class="fa-solid fa-file-csv text-green-700"></i>
              Export CSV
            </button>

            <button id="exportPdfBtn"
              class="px-4 py-2 text-sm border rounded bg-white hover:bg-gray-50 inline-flex items-center gap-2">
              <i class="fa-solid fa-file-pdf text-red-700"></i>
              Export PDF
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="alertContainer" class="fixed top-4 right-4 space-y-2 z-50"></div>
</div>

</body>
</html>
